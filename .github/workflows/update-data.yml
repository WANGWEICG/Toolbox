name: Update Toolbox Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import datetime

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)

          out = {
              "updated_at": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%d %H:%M UTC"),
              "stocks": {},
              "fx": {},
              "weather": {}
          }

          # 0050 / 0056 - TWSE
          try:
              rows = get_json(
                  "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"
              )

              def num(v):
                  try:
                      return float(
                          str(v).replace(",", "").replace("+", "").strip()
                      )
                  except Exception:
                      return None

              for code in ("0050", "0056"):
                  row = next(
                      (
                          x for x in rows
                          if str(x.get("Code", "")).strip() == code
                      ),
                      None
                  )
                  if row:
                      out["stocks"][code] = {
                          "name": row.get("Name", ""),
                          "close": num(row.get("ClosingPrice")),
                          "change": num(row.get("Change"))
                      }

          except Exception as e:
              out["stocks_error"] = str(e)

          # Foreign exchange
          try:
              fx = get_json(
                  "https://api.frankfurter.dev/v1/latest"
                  "?base=TWD&symbols=USD,JPY,PHP,EUR,GBP,CNY"
              )
              rates = fx.get("rates", {})

              for currency, value in rates.items():
                  out["fx"]["TWD_" + currency] = value

              if rates.get("USD"):
                  out["fx"]["USD_TWD"] = 1 / rates["USD"]

          except Exception as e:
              out["fx_error"] = str(e)

          # Kaohsiung weather
          try:
              w = get_json(
                  "https://api.open-meteo.com/v1/forecast"
                  "?latitude=22.6273"
                  "&longitude=120.3014"
                  "&current=temperature_2m,apparent_temperature,weather_code"
                  "&timezone=Asia%2FTaipei"
              )
              current = w.get("current", {})
              code = int(current.get("weather_code", 0))

              def weather_desc(code):
                  if code == 0:
                      return "晴朗"
                  if code in (1, 2):
                      return "晴時多雲"
                  if code == 3:
                      return "多雲"
                  if code in (45, 48):
                      return "霧"
                  if code in (51, 53, 55, 56, 57):
                      return "毛毛雨"
                  if code in (61, 63, 65, 66, 67):
                      return "下雨"
                  if code in (80, 81, 82):
                      return "陣雨"
                  if code in (95, 96, 99):
                      return "雷雨"
                  return "天氣"

              out["weather"] = {
                  "temperature": current.get("temperature_2m"),
                  "apparent": current.get("apparent_temperature"),
                  "description": weather_desc(code)
              }

          except Exception as e:
              out["weather_error"] = str(e)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data
        run: |
          git config user.name "wangwei-toolbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update toolbox data"
          git push
