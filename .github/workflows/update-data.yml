name: Update Toolbox Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: toolbox-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public data
        run: |
          python - <<'PY'
          import datetime
          import json
          import math
          import urllib.request
          
          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "WangWeiToolbox/5.0 (GitHub Actions)",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)
          
          out = {
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "stocks": {},
              "fx": {},
              "weather": {},
          }
          
          # TWSE 0050 / 0056.  Reference prices, not a real-time market feed.
          try:
              rows = get_json("https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL")
              if not isinstance(rows, list):
                  raise ValueError("TWSE response is not an array")
          
              def num(value):
                  try:
                      n = float(str(value).replace(",", "").replace("+", "").strip())
                      return n if math.isfinite(n) else None
                  except (ValueError, TypeError):
                      return None
          
              for code in ("0050", "0056"):
                  row = next((x for x in rows if str(x.get("Code", "")).strip() == code), None)
                  if row:
                      out["stocks"][code] = {
                          "name": row.get("Name", ""),
                          "close": num(row.get("ClosingPrice")),
                          "change": num(row.get("Change")),
                      }
              if any(out["stocks"].get(code, {}).get("close") is None for code in ("0050", "0056")):
                  out["stocks_error"] = "TWSE ETF closing price incomplete"
          except Exception as e:
              out["stocks_error"] = str(e)
          
          # Frankfurter v2 supports TWD and returns an ARRAY of rate objects.
          try:
              fx_rows = get_json(
                  "https://api.frankfurter.dev/v2/rates"
                  "?base=TWD&quotes=USD,JPY,PHP,EUR,GBP,CNY"
              )
              if not isinstance(fx_rows, list):
                  raise ValueError("Frankfurter v2 rates response is not an array")
              wanted = {"USD", "JPY", "PHP", "EUR", "GBP", "CNY"}
              for row in fx_rows:
                  if not isinstance(row, dict):
                      continue
                  base = str(row.get("base", "")).upper()
                  quote = str(row.get("quote", "")).upper()
                  if base != "TWD" or quote not in wanted:
                      continue
                  rate = float(row["rate"])
                  if not math.isfinite(rate) or rate <= 0:
                      raise ValueError("Invalid Frankfurter rate for " + quote)
                  out["fx"]["TWD_" + quote] = rate
                  if row.get("date"):
                      out.setdefault("fx_dates", {})[quote] = str(row["date"])
              missing = wanted - {k.removeprefix("TWD_") for k in out["fx"]}
              if missing:
                  out["fx_error"] = "Missing FX pairs: " + ", ".join(sorted(missing))
              usd = out["fx"].get("TWD_USD")
              if usd:
                  out["fx"]["USD_TWD"] = 1 / usd
              if out.get("fx_dates"):
                  out["fx_date"] = max(out["fx_dates"].values())
          except Exception as e:
              out["fx_error"] = str(e)
          
          # Kaohsiung current weather.
          try:
              w = get_json(
                  "https://api.open-meteo.com/v1/forecast"
                  "?latitude=22.6273"
                  "&longitude=120.3014"
                  "&current=temperature_2m,apparent_temperature,weather_code"
                  "&timezone=Asia%2FTaipei"
              )
              current = w.get("current", {})
              code = int(current.get("weather_code", -1))
          
              def weather_desc(value):
                  if value == 0:
                      return "晴朗"
                  if value in (1, 2):
                      return "晴時多雲"
                  if value == 3:
                      return "多雲"
                  if value in (45, 48):
                      return "霧"
                  if value in (51, 53, 55, 56, 57):
                      return "毛毛雨"
                  if value in (61, 63, 65, 66, 67):
                      return "下雨"
                  if value in (80, 81, 82):
                      return "陣雨"
                  if value in (95, 96, 99):
                      return "雷雨"
                  return "天氣"
          
              temp = current.get("temperature_2m")
              if temp is None:
                  raise ValueError("Open-Meteo has no current temperature")
              out["weather"] = {
                  "temperature": temp,
                  "apparent": current.get("apparent_temperature"),
                  "description": weather_desc(code),
              }
          except Exception as e:
              out["weather_error"] = str(e)
          
          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(out, file, ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data
        run: |
          git config user.name "wangwei-toolbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update toolbox data"
          git push
